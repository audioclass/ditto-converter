[package]
name = "ditto-converter"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "ditto_app"
path = "src/lib.rs"

[[bin]]
name = "ditto-converter"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]
custom-protocol = ["tauri/custom-protocol"]
smoke = ["desktop", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dependencies]
ditto-core = { path = "../crates/ditto-core" }
ditto-online = { path = "../crates/ditto-online" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fs2 = "0.4"
tauri = { version = "~2.12.4", optional = true, features = ["protocol-asset"] }
tauri-plugin-dialog = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.5", optional = true }
objc2-app-kit = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "NSWindow", "NSView"] }
objc2-foundation = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "NSGeometry", "objc2-core-foundation"] }

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }
