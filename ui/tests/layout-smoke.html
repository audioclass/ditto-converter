<!doctype html><html lang="en"><meta charset="utf-8"><title>TEST ONLY · viewport layout</title><div id="app"></div><script type="module">
// Layout fixtures only; this page is not an application build entry point.
import { mockIPC, mockWindows } from '@tauri-apps/api/mocks';
window.isTauri = true;
mockWindows('main');
const state = { jobs: [], output_dir: '/fixtures/export', running: false, online_available: false, component_status: 'Not installed' };
mockIPC(command => {
  if (command === 'snapshot') return structuredClone(state);
  if (command === 'component_info') return { status: 'fixture' };
  if (command.startsWith('plugin:')) return null;
  throw new Error(`Unexpected layout fixture command: ${command}`);
}, { shouldMockEvents: true });
await import('../src/main.ts');
window.setLayoutFixture = async ({ rows, complete = false, error = null, notice = false, inspector = false }) => {
  state.jobs = Array.from({ length: rows }, (_, position) => ({ id: `layout-${position}`, position, title: `Layout fixture ${position + 1}`, source: { kind: 'local', path: '/fixtures/input.wav' }, duration: 4, trim_start: 0, trim_end: null, selected: true, state: complete ? 'complete' : 'queued', progress: null, error: null, output: complete ? '/fixtures/output.wav' : null }));
  const until = async predicate => {
    for (let i = 0; i < 100; i++) {
      if (predicate()) return;
      await new Promise(resolve => setTimeout(resolve, 25));
    }
    throw new Error('Layout fixture did not render');
  };
  await until(() => document.querySelectorAll('.queue-row').length === rows && document.querySelectorAll('.job-output').length === (complete ? rows : 0));
  document.getElementById('error-text').textContent = error ?? '';
  document.getElementById('error-banner').hidden = !error;
  document.getElementById('desktop-notice').hidden = !notice;
  if (inspector && rows) {
    document.querySelector('.track-info').click();
    await until(() => !document.getElementById('inspector-track').hidden);
  }
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
};
window.layoutReady = true;
</script></html>
