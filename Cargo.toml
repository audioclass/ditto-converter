[workspace]
members = ["src-tauri", "crates/ditto-core", "crates/ditto-online"]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

# Reconstruct before any Cargo command; exact archive and one-file variant are verified.
[patch.crates-io]
objc2-core-foundation = { path = ".work/dependency-remediation/objc2-core-foundation-0.3.2" }
